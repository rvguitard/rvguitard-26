  Then either upload wall.js, chat.js, utils.js to your Webflow site and reference their URLs here,
  or paste their contents inline below (recommended to upload them as separate assets).

  IMPORTANT:
  - SUPABASE_URL: found in Supabase project settings (API -> URL)
  - SUPABASE_ANON_KEY: the public anon key (API -> anon key). Never embed your service_role key here.

  Required HTML elements on the page (make sure these exist in your Webflow page):
  - <form id="wallForm"><input id="wallInput" ...></form>

  - <form id="chatForm"><input id="chatInput" ...></form>
  - <div id="chatList"></div>

<!-- Supabase JS (v2 UMD) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<!-- Replace these placeholders before publishing -->
<script>
  // TODO: Replace these with your project's values
  window.SUPABASE_URL = "https://YOUR-PROJECT.supabase.co";
  window.SUPABASE_ANON_KEY = "YOUR_ANON_KEY";

  // Initialize a globally-available client
  // The UMD build exposes a global named `supabase` with createClient
  window.supabaseClient = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY, {
    // Optional: adjust realtime settings if needed
    // realtime: { params: { eventsPerSecond: 10 } }
  });
</script>
