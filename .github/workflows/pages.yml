name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /rvguitard-26
          NEXT_PUBLIC_SUPABASE_URL: https://okwbjcsmqohnjtpxyjkb.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9rd2JqY3NtcW9obmp0cHh5amtiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwOTgzOTksImV4cCI6MjA5NDY3NDM5OX0.6Z00uBeesqZBMwaqXJJHT9tljzlQWHzT5jiuAma5Rj4
          NEXT_PUBLIC_UNO_CHAT_API_URL: https://okwbjcsmqohnjtpxyjkb.supabase.co/functions/v1/uno-guide

      - name: Preserve Next assets on Pages
        run: touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
